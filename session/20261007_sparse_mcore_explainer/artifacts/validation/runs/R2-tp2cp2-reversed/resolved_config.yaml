distillation:
  num_prompts_per_step: 8
  num_generations_per_prompt: 1
  max_rollout_turns: 1
  max_num_steps: 3
  max_num_epochs: 6
  val_batch_size: 64
  val_period: 0
  val_at_start: false
  val_at_end: true
  max_val_samples: 512
  topk_logits_k: 64
  seed: 1234
  offload_student_after_step: true
loss_fn:
  kl_type: mixed
  mixed_kl_weight: 0.5
  zero_outside_topk: false
  temperature: 1.0
  vocab_topk: 64
  reverse_kl: false
  kl_loss_weight: 1.0
  ce_loss_scale: 0.1
  dynamic_loss_scaling: false
  common_indices_from_subtoks: true
  kl_chunk_shift: true
  prefix_bidir_v3_loss_fn: kl
  prefix_bidir_v3_last_pos_loss_fn: null
  prefix_bidir_v3_jsd_beta: 0.5
  prefix_bidir_v3_position_0_kl: false
  prefix_bidir_v3_noise_filter_topk: 0
  teacher_topk_ipc_k: 64
  teacher_topk_ipc_support_mode: row_topk
  teacher_topk_ipc_keep_realized: true
  kd_loss_mode: sum
  sum_weights_metric: null
  alpha: 1.0
  normalize_teacher_by_vocab: false
  prefix_bidir_v3_mismatch_pos0_alpha: 0.0
  prefix_bidir_v3_mismatch_loss_beta: 1.0
checkpointing:
  enabled: false
  checkpoint_dir: checkpoints/xtoken-off-policy-distillation
  metric_name: train:loss
  higher_is_better: false
  keep_top_k: 3
  save_period: 600
  checkpoint_must_save_by: null
  save_optimizer: true
policy:
  model_name: /lustre/fs1/portfolios/coreai/projects/coreai_dlalgo_genai/users/avenkateshha/hf/hub/models--meta-llama--Llama-3.2-1B/snapshots/4e20de362430cd3b72f300e6b0f18e50e7166e08
  tokenizer:
    name: /lustre/fs1/portfolios/coreai/projects/coreai_dlalgo_genai/users/avenkateshha/hf/hub/models--meta-llama--Llama-3.2-1B/snapshots/4e20de362430cd3b72f300e6b0f18e50e7166e08
    chat_template_kwargs: null
  train_global_batch_size: 8
  train_micro_batch_size: 2
  generation_batch_size: 64
  logprob_batch_size: 2
  max_total_sequence_length: 256
  precision: bfloat16
  logprob_chunk_size: null
  offload_optimizer_for_logprob: true
  dtensor_cfg:
    enabled: false
    _v2: true
    checkpoint:
      model_save_format: safetensors
      save_consolidated: 'false'
      single_rank_consolidation: false
      consolidation_timeout_minutes: 30
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 2
    context_parallel_size: 2
    custom_parallel_plan: null
    load_precision: bfloat16
    shard_before_load: false
  dynamic_batching:
    enabled: false
    train_mb_tokens: 2048
    logprob_mb_tokens: 2048
    sequence_length_round: 64
  sequence_packing:
    enabled: false
    train_mb_tokens: 2048
    logprob_mb_tokens: 2048
    algorithm: modified_first_fit_decreasing
    microbatch_order: packer
    sequence_length_round: 64
    fuse_loss: false
  max_grad_norm: 1.0
  make_sequence_length_divisible_by: 8
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 5.0e-05
      weight_decay: 0.001
      betas:
      - 0.9
      - 0.95
      eps: 1.0e-08
      foreach: false
      fused: false
  megatron_cfg:
    enabled: true
    checkpoint:
      async_save: false
      ckpt_assume_constant_structure: false
    force_reconvert_from_hf: false
    empty_unused_memory_level: 0
    activation_checkpointing: false
    cuda_graph_impl: none
    cuda_graph_modules: []
    cuda_graph_warmup_steps: 3
    fine_grained_activation_offloading: false
    offload_modules: null
    recompute_granularity: full
    recompute_modules: null
    tensor_model_parallel_size: 2
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 2
    pipeline_dtype: bfloat16
    sequence_parallel: false
    freeze_moe_router: true
    moe_router_dtype: fp64
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: true
    apply_rope_fusion: true
    bias_activation_fusion: true
    defer_fp32_logits: false
    fp32_lm_head: false
    moe_per_layer_logging: false
    moe_enable_deepep: false
    moe_token_dispatcher_type: alltoall
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false
    gradient_accumulation_fusion: false
    use_fused_weighted_squared_relu: false
    optimizer:
      optimizer: adam
      lr: 5.0e-06
      min_lr: 5.0e-06
      weight_decay: 0.001
      bf16: true
      fp16: false
      params_dtype: float32
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_eps: 1.0e-08
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
      clip_grad: 1.0
    scheduler:
      start_weight_decay: 0.001
      end_weight_decay: 0.001
      weight_decay_incr_style: constant
      lr_decay_style: constant
      lr_decay_iters: 3
      lr_warmup_iters: 0
      lr_warmup_init: 5.0e-06
    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: optim_grads_params
    fp8_cfg:
      enabled: false
      fp8: e4m3
      fp8_recipe: blockwise
      fp8_param: false
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 0.02
      end_factor: 1.0
      total_iters: 250
  - name: torch.optim.lr_scheduler.CosineAnnealingLR
    kwargs:
      T_max: 4750
      eta_min: 0.0
  - milestones:
    - 250
  generation:
    port_range_low: 3000
    port_range_high: 4999
    backend: vllm
    max_new_tokens: 2048
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: 1.0
    val_top_p: 1.0
    val_top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      precision: bfloat16
      kv_cache_dtype: auto
      logprobs_mode: processed_logprobs
      fp32_lm_head: false
      refit_with_reload_api: false
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: 2048
      enforce_eager: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      distributed_executor_backend: null
    vllm_kwargs: {}
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null
  router_replay:
    enabled: false
  freeze_parameter_patterns: null
teacher: null
